# BlitzMate Engine Configuration
#
# Only keys that map to attributes of the dataclasses in engine/config.py
# (SearchConfig, EvalConfig, AnalyzerConfig, UIConfig) are applied here.
# Unknown keys are rejected with a warning at load time.
#
# NOTE: Evaluation tuning (material values, PSTs, bonuses, penalties) is
# defined in engine/config.py (class EvalConfig) — the single source of
# truth for eval parameters. The C++ port bridges from those dataclasses,
# not from this file.

# Search settings.
[search]
depth = 6
iterative_deepening = true
time_limit_ms = 2000
hash_size_mb = 128
threads = 2
use_quiescence = true
q_max_depth = 64
use_null_move = true
null_move_reduction = 2


# Evaluation settings.
[eval]
use_positional = true


# Move classification thresholds (centipawns).
[analyzer]
TH_BRILLIANT = -50
TH_BEST = 50
TH_GOOD = 150
TH_INACCURACY = 300
TH_MISTAKE = 600


# Engine identity.
[ui]
engine_name = "BlitzMate"
engine_author = "Medo"
enable_uci = true
uci_threads = 2
